name: Build Ionic Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-android:
    name: Build Android debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      - name: Build Ionic Vue application
        run: npm run build

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Check Java version
        run: java -version

      - name: Check Android SDK availability
        run: |
          echo "ANDROID_HOME=${ANDROID_HOME}"
          export PATH="${ANDROID_HOME}/cmdline-tools/latest/bin:${ANDROID_HOME}/platform-tools:${PATH}"
          sdkmanager --version
          adb --version

      - name: Sync Capacitor Android project
        run: npx cap sync android

      - name: Build Android debug APK
        working-directory: android
        run: ./gradlew --no-daemon assembleDebug

      - name: Prepare APK artifact
        run: cp android/app/build/outputs/apk/debug/app-debug.apk DailyTaskManager.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: DailyTaskManager-APK
          path: DailyTaskManager.apk
          if-no-files-found: error
